name: Enforce dev → main flow

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    name: Require PR from dev
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs to main must come from the dev branch (got: ${{ github.head_ref }})."
            exit 1
          fi
